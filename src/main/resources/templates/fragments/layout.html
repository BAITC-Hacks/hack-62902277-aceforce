<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head th:fragment="head(title)">
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${title}+' · Career Quest'">Career Quest</title>
<link rel="stylesheet" th:href="@{/css/app.css}"><script defer th:src="@{/js/app.js}"></script></head>
<body><aside th:fragment="sidebar" class="sidebar">
<a class="brand" th:href="@{/}"><span class="brand-mark">CQ</span>Career Quest<span class="beta">LAB</span></a>
<p class="eyebrow" th:text="#{workspace}">Workspace</p>
<nav><a th:href="@{/(employeeId=${employeeId})}" th:text="#{nav.dashboard}">Overview</a>
<a th:href="@{/activities(employeeId=${employeeId})}" th:text="#{nav.activities}">Activity history</a>
<a th:href="@{/achievements(employeeId=${employeeId})}" th:text="#{nav.achievements}">Achievements</a>
<a th:if="${isHr}" th:href="@{/hr}" th:text="#{nav.hr}">HR analytics</a></nav>
<div class="sidebar-bottom"><p class="eyebrow" th:text="#{language}">Language</p>
<div class="languages"><a href="?lang=kk">ҚАЗ</a><a href="?lang=ru">РУС</a><a href="?lang=en">ENG</a></div>
<p class="small muted" th:text="#{demo.notice}">Synthetic data · Demo</p>
<form th:action="@{/logout}" method="post"><button class="ghost" th:text="#{logout}">Sign out</button></form></div>
</aside></body></html>
