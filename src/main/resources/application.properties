spring.application.name=career-quest
spring.profiles.default=mysql
spring.thymeleaf.cache=false
spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql
server.error.include-message=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
career.dataset-location=${DATASET_LOCATION:classpath:data/}
career.as-of=2026-10-01
career.demo-users=${DEMO_USERS:false}
career.demo-password=${DEMO_PASSWORD:}
logging.config=classpath:log4j2.xml

