<!doctype html><html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}"><head th:replace="~{fragments/layout :: head(#{nav.achievements})}"></head><body><aside th:replace="~{fragments/layout :: sidebar}"></aside><main class="main">
<p class="eyebrow">MILESTONES</p><h1 th:text="#{nav.achievements}"></h1><p class="muted" th:text="#{xp.note}"></p><section class="stats"><article class="card"><span th:text="#{your.level}"></span><h2 th:text="${game.level}"></h2></article><article class="card"><span>XP</span><h2 th:text="${game.xp}"></h2></article></section>
<section class="badges"><article class="card badge-card" th:each="b:${game.badges}"><div class="badge-icon">✦</div><h2 th:text="#{${'badge.'+b}}"></h2></article></section><p th:if="${game.badges.isEmpty()}" th:text="#{no.badges}"></p></main></body></html>
