services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: career_quest
      MYSQL_USER: career
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD before starting}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - career_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root --password=\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 30
volumes:
  career_mysql:

